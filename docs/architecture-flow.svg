<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" role="img" aria-labelledby="calicortado-complete-logical-service-flow-title calicortado-complete-logical-service-flow-desc"><title id="calicortado-complete-logical-service-flow-title">Calicortado complete logical service flow</title><desc id="calicortado-complete-logical-service-flow-desc">Eleven configurable domain endpoints plus devices and indexing worker. Solid arrows show major service requests; the shared identity and operations bands apply across the diagram. Local bridge and backup work stays inside the data boundary.</desc><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1600" height="1500" rx="24" fill="#f6f5ef"/><style>text{font-family:Arial,sans-serif;fill:#172b36}.small{font-size:17px}.body{font-size:20px}.name{font-size:24px;font-weight:700}.eyebrow{font-size:15px;font-weight:700;letter-spacing:1px}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#flow-arrow)}</style><text x="60" y="48" class="name">How the complete product talks to itself</text><text x="60" y="78" class="small">PROPOSED • Every domain box means HTTPS through that destination’s Traefik</text><path class="line" d="M265 235 V320"/><path class="line" d="M795 235 V320"/><path class="line" d="M1325 235 V320"/><path class="line" d="M970 382 H1150"/><path class="line" d="M795 445 V610"/><path class="line" d="M970 405 H1060 V660 H1150"/><path class="line" d="M265 445 V610"/><path class="line" d="M1325 445 V520 H265 V610"/><path class="line" d="M620 670 H440"/><path class="line" d="M1150 670 H970"/><path class="line" d="M705 735 V825 H265 V920"/><path class="line" d="M885 735 V835 H1325 V920"/><path class="line" d="M620 970 H440"/><path class="line" d="M970 985 H1150"/><path class="line" d="M795 920 V800 H390 V735"/><path class="line" d="M1500 680 H1540 V1280 H1500"/><path class="line" d="M155 735 H45 V1280 H90"/><rect x="90" y="110" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="90" y="110" width="6" height="125" rx="3" fill="#9a6126"/><text x="110" y="137" class="eyebrow" style="fill:#9a6126">DEVICE</text><text x="110" y="169" class="name">Obsidian</text><text x="110" y="197" class="small">iPhone + Mac • local editing</text><rect x="620" y="110" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="620" y="110" width="6" height="125" rx="3" fill="#9a6126"/><text x="640" y="137" class="eyebrow" style="fill:#9a6126">DEVICE</text><text x="640" y="169" class="name">Browser</text><text x="640" y="197" class="small">Capture / Search / Ask</text><rect x="1150" y="110" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="1150" y="110" width="6" height="125" rx="3" fill="#9a6126"/><text x="1170" y="137" class="eyebrow" style="fill:#9a6126">DEVICE</text><text x="1170" y="169" class="name">Phone Shortcut</text><text x="1170" y="197" class="small">Receipt ID + offline fallback</text><rect x="90" y="320" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="90" y="320" width="6" height="125" rx="3" fill="#156b60"/><text x="110" y="347" class="eyebrow" style="fill:#156b60">DATA ROLE</text><text x="110" y="379" class="name">Sync</text><text x="110" y="407" class="small">sync.domain</text><text x="110" y="432" class="small">Encrypted sync ↔ local bridge</text><rect x="620" y="320" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="620" y="320" width="6" height="125" rx="3" fill="#9a6126"/><text x="640" y="347" class="eyebrow" style="fill:#9a6126">DISPLAY ROLE</text><text x="640" y="379" class="name">Web interface</text><text x="640" y="407" class="small">app.domain</text><text x="640" y="432" class="small">Human session; no machine keys</text><rect x="1150" y="320" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="1150" y="320" width="6" height="125" rx="3" fill="#365db0"/><text x="1170" y="347" class="eyebrow" style="fill:#365db0">COMPUTE ROLE</text><text x="1170" y="379" class="name">Capture</text><text x="1170" y="407" class="small">capture.domain</text><text x="1170" y="432" class="small">Create-only ingestion</text><rect x="90" y="610" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="90" y="610" width="6" height="125" rx="3" fill="#156b60"/><text x="110" y="637" class="eyebrow" style="fill:#156b60">DATA ROLE</text><text x="110" y="669" class="name">Data + local vault</text><text x="110" y="697" class="small">data.domain</text><text x="110" y="722" class="small">Notes, revisions, IDs, change feed</text><rect x="620" y="610" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="620" y="610" width="6" height="125" rx="3" fill="#365db0"/><text x="640" y="637" class="eyebrow" style="fill:#365db0">COMPUTE ROLE</text><text x="640" y="669" class="name">Search</text><text x="640" y="697" class="small">search.domain</text><text x="640" y="722" class="small">Current permitted results</text><rect x="1150" y="610" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="1150" y="610" width="6" height="125" rx="3" fill="#365db0"/><text x="1170" y="637" class="eyebrow" style="fill:#365db0">COMPUTE ROLE</text><text x="1170" y="669" class="name">Answers</text><text x="1170" y="697" class="small">answers.domain</text><text x="1170" y="722" class="small">Retrieval + cited response</text><rect x="90" y="920" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="90" y="920" width="6" height="125" rx="3" fill="#156b60"/><text x="110" y="947" class="eyebrow" style="fill:#156b60">DATA ROLE / DERIVED</text><text x="110" y="979" class="name">Index</text><text x="110" y="1007" class="small">index.domain</text><text x="110" y="1032" class="small">Rebuildable lookup store</text><rect x="620" y="920" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="620" y="920" width="6" height="125" rx="3" fill="#365db0"/><text x="640" y="947" class="eyebrow" style="fill:#365db0">COMPUTE ROLE</text><text x="640" y="979" class="name">Indexing worker</text><text x="640" y="1007" class="small">No extra public endpoint</text><text x="640" y="1032" class="small">Read changes → embed → index</text><rect x="1150" y="920" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="1150" y="920" width="6" height="125" rx="3" fill="#365db0"/><text x="1170" y="947" class="eyebrow" style="fill:#365db0">COMPUTE ROLE</text><text x="1170" y="979" class="name">Embeddings</text><text x="1170" y="1007" class="small">embed.domain</text><text x="1170" y="1032" class="small">Text / query → meaning vectors</text><rect x="90" y="1220" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="90" y="1220" width="6" height="125" rx="3" fill="#a34552"/><text x="110" y="1247" class="eyebrow" style="fill:#a34552">RECOVERY ROLE</text><text x="110" y="1279" class="name">Backup repository</text><text x="110" y="1307" class="small">backup.domain</text><text x="110" y="1332" class="small">Encrypted independent copy</text><rect x="620" y="1220" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="620" y="1220" width="6" height="125" rx="3" fill="#445669"/><text x="640" y="1247" class="eyebrow" style="fill:#445669">ACCESS ROLE</text><text x="640" y="1279" class="name">Identity / grant broker</text><text x="640" y="1307" class="small">auth.domain</text><text x="640" y="1332" class="small">Scoped grants; live integration due</text><rect x="1150" y="1220" width="350" height="125" rx="14" fill="white" stroke="#d7dfdf"/><rect x="1150" y="1220" width="6" height="125" rx="3" fill="#7353a5"/><text x="1170" y="1247" class="eyebrow" style="fill:#7353a5">AI ROLE</text><text x="1170" y="1279" class="name">Local inference</text><text x="1170" y="1307" class="small">infer.domain</text><text x="1170" y="1332" class="small">Bounded excerpts → generation</text><text x="280" y="485" class="small">bridge stays data-local</text><text x="570" y="507" class="small">capture saves through data API</text><text x="455" y="655" class="small">source + access</text><text x="465" y="955" class="small">index updates</text><text x="985" y="969" class="small">text to vectors</text><text x="810" y="810" class="small">change feed</text><text x="970" y="815" class="small">query vector</text><text x="65" y="1140" class="small">local snapshot worker</text><text x="60" y="1405" class="small">Shared rules: private access + DNS; identity checked at protected destinations; operations observe all roles.</text><text x="60" y="1435" class="small">Only data-local code touches the vault. Other layers use domain APIs. AI has no note-write or admin authority.</text><text x="60" y="1465" class="small">Arrows show requests / local data operations; responses return on the same connection. No live deployment claimed.</text></svg>