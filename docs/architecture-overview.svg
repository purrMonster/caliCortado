<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" role="img" aria-labelledby="calicortado-architecture-overview-title calicortado-architecture-overview-desc"><title id="calicortado-architecture-overview-title">Calicortado architecture overview</title><desc id="calicortado-architecture-overview-desc">Proposed roles: devices, private access, display, compute, data, local AI and independent recovery. All service boundaries use named HTTPS routes through destination-local Traefik.</desc><defs><marker id="overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1400" height="930" rx="24" fill="#f6f5ef"/><style>text{font-family:Arial,sans-serif;fill:#172b36}.small{font-size:17px}.body{font-size:20px}.name{font-size:24px;font-weight:700}.eyebrow{font-size:15px;font-weight:700;letter-spacing:1px}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#overview-arrow)}</style><text x="45" y="55" class="name">A personal library, built from replaceable parts</text><text x="45" y="86" class="small">PROPOSED PRODUCT • role separation does not require one new machine per box</text><rect x="45" y="120" width="620" height="115" rx="14" fill="white" stroke="#d7dfdf"/><rect x="45" y="120" width="6" height="115" rx="3" fill="#9a6126"/><text x="65" y="147" class="eyebrow" style="fill:#9a6126">YOUR DEVICES</text><text x="65" y="179" class="name">Write in Obsidian</text><text x="65" y="207" class="small">iPhone + Mac • local notes remain editable offline</text><rect x="700" y="120" width="655" height="115" rx="14" fill="white" stroke="#d7dfdf"/><rect x="700" y="120" width="6" height="115" rx="3" fill="#9a6126"/><text x="720" y="147" class="eyebrow" style="fill:#9a6126">YOUR INTERFACE</text><text x="720" y="179" class="name">Capture · Search · Ask</text><text x="720" y="207" class="small">Browser + phone Shortcut • one simple experience</text><path class="line" d="M355 235 V275"/><path class="line" d="M1025 235 V275"/><rect x="45" y="280" width="1310" height="90" rx="14" fill="#e0e9ec"/><text x="70" y="313" class="eyebrow">PRIVATE ACCESS + DNS + IDENTITY</text><text x="70" y="346" class="body">Each receiving host: Traefik + verified HTTPS → service checks permissions</text><path class="line" d="M245 370 V410"/><path class="line" d="M700 370 V410"/><path class="line" d="M1155 370 V410"/><rect x="45" y="415" width="405" height="180" rx="14" fill="white" stroke="#d7dfdf"/><rect x="45" y="415" width="6" height="180" rx="3" fill="#9a6126"/><text x="65" y="442" class="eyebrow" style="fill:#9a6126">DISPLAY ROLE</text><text x="65" y="474" class="name">The front desk</text><text x="65" y="502" class="small">app.domain</text><text x="65" y="527" class="small">Web experience and user session</text><text x="65" y="552" class="small">No database credentials in browser</text><rect x="497" y="415" width="405" height="180" rx="14" fill="white" stroke="#d7dfdf"/><rect x="497" y="415" width="6" height="180" rx="3" fill="#365db0"/><text x="517" y="442" class="eyebrow" style="fill:#365db0">COMPUTE ROLE</text><text x="517" y="474" class="name">The working team</text><text x="517" y="502" class="small">capture · search · embed · answers</text><text x="517" y="527" class="small">Indexing worker updates the catalogue</text><text x="517" y="552" class="small">Calls data and AI through APIs</text><rect x="950" y="415" width="405" height="180" rx="14" fill="white" stroke="#d7dfdf"/><rect x="950" y="415" width="6" height="180" rx="3" fill="#156b60"/><text x="970" y="442" class="eyebrow" style="fill:#156b60">DATA ROLE</text><text x="970" y="474" class="name">The originals + catalogue</text><text x="970" y="502" class="small">sync · data · index</text><text x="970" y="527" class="small">Bridge, readable vault, note revisions</text><text x="970" y="552" class="small">Derived index can be rebuilt</text><path class="line" d="M450 505 H497"/><path class="line" d="M902 505 H950"/><path class="line" d="M700 595 V625 H360 V655"/><path class="line" d="M1155 595 V625 H1040 V655"/><rect x="45" y="660" width="620" height="165" rx="14" fill="white" stroke="#d7dfdf"/><rect x="45" y="660" width="6" height="165" rx="3" fill="#7353a5"/><text x="65" y="687" class="eyebrow" style="fill:#7353a5">AI ROLE</text><text x="65" y="719" class="name">The reading assistant</text><text x="65" y="747" class="small">infer.domain • local model behind an adapter</text><text x="65" y="772" class="small">Receives permitted excerpts, not unrestricted vault access</text><text x="65" y="797" class="small">Search and capture do not depend on generation</text><rect x="700" y="660" width="655" height="165" rx="14" fill="white" stroke="#d7dfdf"/><rect x="700" y="660" width="6" height="165" rx="3" fill="#a34552"/><text x="720" y="687" class="eyebrow" style="fill:#a34552">INDEPENDENT RECOVERY ROLE</text><text x="720" y="719" class="name">The recovery copy</text><text x="720" y="747" class="small">backup.domain • encrypted repository</text><text x="720" y="772" class="small">Data-local worker sends a consistent backup</text><text x="720" y="797" class="small">Restoration must be rehearsed, not merely configured</text><text x="45" y="864" class="small">Identity uses auth.domain. Operations cover every role: health, redacted logs, versions and restore drills.</text><text x="45" y="895" class="small">domain = configured DOMAIN • Initial roles may share hardware • Foundation verified; product services planned</text></svg>